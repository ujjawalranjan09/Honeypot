services:
  - type: web
    name: honey-pot-agent
    env: python
    buildCommand: pip install -r requirements.txt && python -c "from scam_detector import detector; detector.train_model()"
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --config gunicorn.conf.py
    envVars:
      - key: HONEYPOT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DISABLE_RESPONSE_DELAY
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.0
